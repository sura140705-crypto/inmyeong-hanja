<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<!-- 화면 이름을 간편/전체로 바꾸면서 주소가 달라졌다. 이미 공유된 링크가
     죽지 않도록 남겨 둔 이동용 파일이다. 내용은 simple.html 에 있다. -->
<meta http-equiv="refresh" content="0; url=simple.html">
<link rel="canonical" href="simple.html">
<title>이동합니다</title>
</head>
<body>
<p><a href="simple.html">simple.html 로 이동합니다.</a></p>
<script>location.replace('simple.html' + location.hash);</script>
</body>
</html>
