<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>인명용 한자 찾기</title>
<style>
  :root{ --navy:#1b3a63; --line:#dfe3e8; --bg:#f5f7f9; --dim:#5c6672; --ok:#0f7b4f; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:#1a1a1a;
       font:16px/1.6 "맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
       overflow-x:hidden; }
  .wrap{ max-width:900px; margin:0 auto; padding:16px 14px 40px; }
  h1{ font-size:20px; margin:6px 0 6px; color:var(--navy); }
  .lead{ color:var(--dim); font-size:14px; margin:0 0 18px; }
  .han{ font-family:"HANBatang","한컴바탕","Batang","바탕","Noto Serif KR","Apple SD Gothic Neo",serif; }

  .panel{ background:#fff; border:1px solid var(--line); border-radius:10px;
          padding:14px; margin-bottom:14px; }
  .panel h2{ font-size:15px; margin:0 0 10px; color:var(--navy); }

  .slots{ display:flex; gap:8px; flex-wrap:wrap; }
  .slot{ flex:1 1 84px; min-width:84px; max-width:120px; border:2px solid var(--line);
         border-radius:10px; background:#fff; padding:8px 4px; text-align:center;
         cursor:pointer; min-height:104px; display:flex; flex-direction:column;
         align-items:center; justify-content:center; gap:3px; }
  .slot.active{ border-color:var(--navy); background:#eef3f9; }
  .slot .no{ font-size:11px; color:var(--dim); }
  .slot .gl{ font-size:40px; line-height:1.05; }
  .slot .gl img{ width:44px; height:44px; display:block; }
  .slot .ph{ color:#9aa4ae; font-size:13px; }
  .slot input{ width:100%; border:0; border-bottom:1px solid var(--line); text-align:center;
               font-size:34px; line-height:1.2; padding:0 0 4px; outline:none;
               background:transparent; font-weight:500; }
  .slot .go{ margin-top:7px; height:24px; padding:0 9px; font-size:11.5px;
             border:1px solid #b9c3ce; background:#fff; color:var(--dim);
             border-radius:5px; cursor:pointer; line-height:1; }
  .slot .go:active{ background:#eef3f9; }
  .addbtn{ flex:0 0 auto; border:1px dashed #b8c0c8; background:#fff; border-radius:10px;
           min-height:104px; padding:0 12px; color:var(--dim); font-size:13px; cursor:pointer; }

  .err{ color:#b3261e; font-size:13px; margin-top:8px; display:none; }
  .cnt{ color:var(--dim); font-size:13px; margin:2px 0 10px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 4px 7px;
         text-align:center; cursor:pointer; position:relative; }
  .card:active{ background:#eef3f9; }
  .card.on{ border-color:var(--navy); border-width:2px; background:#eef3f9; padding:7px 3px 6px; }
  .card .no{ font-size:11px; color:var(--dim); letter-spacing:.02em; }
  .card .gl{ font-size:56px; line-height:1.1; margin:2px 0; }
  .card .gl img{ width:58px; height:58px; display:block; margin:0 auto; }
  .card .mn{ font-size:11px; color:var(--dim); height:16px; overflow:hidden; }
  .card .mn.none{ color:#b3bac1; }
  /* 영문 자해만 있는 글자. 훈이 아니라는 표시. */
  .card .mn.en{ color:#7b848d; font-size:10px; }
  .sheet .en{ background:#f2f4f7; border:1px dashed #b6bec8; border-radius:6px;
              padding:7px 10px; margin-top:10px; text-align:left; }
  .sheet .en .enh{ font-size:11px; color:#c94f2e; margin-bottom:3px; }
  .sheet .en .ent{ font-size:13.5px; color:#3c4650; font-style:italic; line-height:1.45; }
  .card .ck{ position:absolute; top:3px; right:5px; color:var(--navy); font-size:14px; display:none; }
  .card.on .ck{ display:block; }

  .result .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .rcell{ border:1px solid var(--line); border-radius:10px; background:#fff;
          padding:8px 10px; text-align:center; min-width:96px; }
  .rcell .no{ font-size:12px; color:var(--navy); font-weight:bold; }
  .rcell .gl{ font-size:60px; line-height:1.1; }
  .rcell .gl img{ width:62px; height:62px; display:block; margin:0 auto; }
  .btns{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  button.b{ min-height:44px; padding:0 16px; font-size:15px; border-radius:8px;
            border:1px solid var(--navy); background:var(--navy); color:#fff; cursor:pointer; }
  button.b.sub{ background:#fff; color:var(--navy); }
  .copybox{ margin-top:10px; background:#f0f4f8; border:1px solid var(--line); border-radius:8px;
            padding:10px; font-size:14px; white-space:pre-wrap; word-break:break-all; }
  .warnbox{ margin-top:10px; background:#fff6e8; border:1px solid #e6cfa4; border-radius:8px;
            padding:10px; font-size:13px; }

  .notice{ color:var(--dim); font-size:12.5px; line-height:1.7; margin-top:18px;
           border-top:1px solid var(--line); padding-top:14px; }

  .show{ position:fixed; inset:0; background:#fff; z-index:30; display:none;
         flex-direction:column; align-items:center; justify-content:center;
         padding:18px 12px calc(18px + env(safe-area-inset-bottom)); text-align:center; }
  .show.open{ display:flex; }
  .showhead{ color:var(--dim); font-size:13px; margin-bottom:4px; }
  /* 모바일은 세로로 길다. 이름을 세로로 세우면 같은 화면에서 자형을 훨씬 크게
     보여줄 수 있다. 가로 화면일 때만 옆으로 늘어놓는다. */
  .showrow{ display:flex; gap:10px; align-items:center; justify-content:center;
            flex-direction:column; flex:1; width:100%; overflow:auto; }
  .showrow.land{ flex-direction:row; align-items:flex-start; align-content:center; flex-wrap:wrap; }
  .scell{ text-align:center; }
  .scell .no{ font-size:clamp(15px,4.6vw,22px); font-weight:bold; color:var(--navy);
              background:#eef3f9; border-radius:6px; padding:2px 10px; display:inline-block;
              margin-bottom:6px; }
  .scell .gl{ line-height:1; }
  .scell .gl img{ display:block; margin:0 auto; }
  .scell .rdmn{ font-size:clamp(12px,3.6vw,17px); color:#333; margin-top:2px; }
  .scell .rdmn b{ color:var(--navy); }
  .showfoot{ color:#8a939c; font-size:11.5px; line-height:1.6; margin:10px 0 12px; }
  #bclose{ min-width:140px; }

  .modal{ position:fixed; inset:0; background:rgba(20,28,38,.55); display:none;
          align-items:center; justify-content:center; padding:16px; z-index:20; }
  .modal.open{ display:flex; }
  .sheet{ background:#fff; border-radius:14px; padding:18px 16px 16px; max-width:340px;
          width:100%; text-align:center; }
  .sheet .no{ font-size:15px; color:var(--navy); font-weight:bold; }
  .sheet .gl{ font-size:200px; line-height:1.05; margin:6px 0 2px; }
  .sheet .gl img{ width:200px; height:200px; display:block; margin:0 auto; }
  .sheet .mn{ color:var(--dim); font-size:14px; }
  .sheet .mn.none{ color:#b3bac1; }
  .sheet .src{ color:#8a939c; font-size:11.5px; margin-top:8px; line-height:1.7; }
  @media (max-width:380px){
    .sheet .gl{ font-size:170px; } .sheet .gl img{ width:170px; height:170px; }
    .card .gl{ font-size:50px; } .card .gl img{ width:52px; height:52px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>인명용 한자 찾기
    <a href="full.html" style="float:right;font-size:11.5px;font-weight:normal;
       color:#5c6672;text-decoration:none;line-height:2.2">전체 조회 →</a></h1>
  <p class="lead">이름의 한글음을 입력하고 사용할 한자를 선택해 보세요.<br>
     선택번호를 상대에게 알려주면 같은 한자를 쉽게 확인할 수 있습니다.</p>

  <div class="panel">
    <h2>이름의 한글음</h2>
    <div class="slots" id="slots"></div>
    <div class="err" id="err"></div>
    <div id="res" style="display:none">
      <div class="btns">
        <button class="b" id="bshow">크게 보여주기</button>
        <button class="b sub" id="bcopy">선택번호 복사</button>
        <button class="b sub" id="breset">다시 선택</button>
      </div>
      <div class="copybox" id="cbox"></div>
      <div class="warnbox" id="wbox" style="display:none"></div>
    </div>
  </div>

  <div class="panel" id="pick" style="display:none">
    <h2 id="pickTitle"></h2>
    <div class="cnt" id="cnt"></div>
    <div class="grid" id="grid"></div>
  </div>

  <p class="notice">
    선택번호는 이 페이지에서 한자를 쉽게 확인하기 위한 안내번호이며,
    대법원이 부여한 공식 한자 코드는 아닙니다.<br>
    실제 신고 가능 여부와 정확한 자형은 가족관계등록 담당기관에서 최종 확인해 주세요.<br>
    자료 기준: 2024. 6. 11. 시행 인명용 한자표
  </p>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<div class="show" id="show">
  <div class="showhead">보여주기 화면</div>
  <div class="showrow" id="showrow"></div>
  <div class="showfoot">
    자료 기준: 2024. 6. 11. 시행 인명용 한자표<br>
    선택번호는 이 페이지의 안내번호입니다.
  </div>
  <button class="b sub" id="bclose">닫기</button>
</div>

  const [rnum, ch, code, mn, img] = item;
  if (img){ const i = new Image(); i.src = 'glyphs/' + img; i.alt = ch || '자형'; return i; }
  const e = document.createElement('div'); e.className = 'han'; e.textContent = ch; return e;
}
function box(cls, item){
  const d = document.createElement('div'); d.className = cls + ' han';
  d.appendChild(glyphEl(item)); return d;
}

function renderSlots(){
  const w = $('#slots'); w.innerHTML = '';
  slots.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'slot' + (active === i ? ' active' : '');
    if (s.sel){
      const no = document.createElement('div'); no.className='no';
      no.textContent = selId(s.rd, s.sel[0]); d.appendChild(no);
      d.appendChild(box('gl', s.sel));
    } else if (s.rd){
      const no = document.createElement('div'); no.className='no'; no.textContent = s.rd; d.appendChild(no);
      const p = document.createElement('div'); p.className='ph'; p.textContent='한자 선택'; d.appendChild(p);
    } else {
      // 한글은 조합 중에도 input 이벤트가 계속 발화한다.
      // '욱' 을 치는 도중 '우' 로 검색되면 안 되므로 확정 시점에만 조회한다.
      const inp = document.createElement('input');
      inp.type='text'; inp.inputMode='text'; inp.maxLength=1; inp.placeholder='음';
      inp.enterKeyHint='search';
      inp.setAttribute('aria-label', (i+1)+'번째 글자의 한글음');
      inp.onclick = ev => ev.stopPropagation();
      inp.onkeydown = ev => { if (ev.key === 'Enter'){ ev.preventDefault(); go(i, inp.value); } };
      inp.onchange = () => go(i, inp.value);          // 포커스 이동 시 확정
      d.appendChild(inp);
      const b = document.createElement('button'); b.className='go'; b.textContent='조회';
      b.onclick = ev => { ev.stopPropagation(); go(i, inp.value); };
      d.appendChild(b);
    }
    d.onclick = () => { if (s.rd) openPick(i); };
    w.appendChild(d);
  });
  if (slots.length < MAXSLOT){
    const b = document.createElement('button');
    b.className='addbtn'; b.textContent='+ 글자\n추가';
    b.onclick = () => { slots.push({rd:'', sel:null}); renderSlots(); };
    w.appendChild(b);
  }
}

function go(i, raw){
  const v = (raw || '').trim().replace(/\s+/g, '');
  if (!v) return;
  setReading(i, v[0]);
}

function setReading(i, v){
  const err = $('#err');
  const c = v.charCodeAt(0);
  if (!(c >= 0xAC00 && c <= 0xD7A3)){
    err.textContent = '완성된 한글 한 글자를 입력해 주세요. (예: 가)';
    err.style.display = 'block'; return;
  }
  if (!D.r[v]){
    err.textContent = '‘' + v + '’ 음으로 쓸 수 있는 인명용 한자가 없습니다.';
    err.style.display = 'block'; return;
  }
  err.style.display = 'none';
  slots[i] = {rd:v, sel:null};
  renderSlots(); openPick(i); refresh();
}

function openPick(i){
  drawPick(i);
  $('#pick').scrollIntoView({behavior:'smooth', block:'start'});
}

function drawPick(i){
  active = i;
  const rd = slots[i].rd, list = D.r[rd] || [];
  $('#pick').style.display = 'block';
  $('#pickTitle').textContent = '‘' + rd + '’ 한자 고르기';
  $('#cnt').textContent = '‘' + rd + '’(으)로 사용할 수 있는 인명용 한자 ' + list.length + '건';
  const g = $('#grid'); g.innerHTML = '';
  const cur = slots[i].sel ? slots[i].sel[0] : -1;
  for (const it of list){
    const [rnum, ch, code, mn] = it;
    const c = document.createElement('div');
    c.className = 'card' + (rnum === cur ? ' on' : '');
    const no = document.createElement('div'); no.className='no'; no.textContent = selId(rd, rnum);
    c.appendChild(no);
    c.appendChild(box('gl', it));
    // 훈이 없을 때 빈 줄로 두면 화면이 덜 그려진 것처럼 보인다. 밝혀서 적는다.
    // 영문 자해만 있는 글자는 카드에 [영문] 표시만 하고 원문은 눌러서 본다.
    // 좁은 카드에 영어를 늘어놓으면 읽히지도 않고 훈처럼 보인다.
    const m = document.createElement('div');
    if (mn){ m.className='mn'; m.textContent = mn; }
    else if (ch && EN[ch]){ m.className='mn en'; m.textContent = '[영문]'; }
    else { m.className='mn none'; m.textContent = '뜻 정보 없음'; }
    c.appendChild(m);
    const k = document.createElement('div'); k.className='ck'; k.textContent='✓'; c.appendChild(k);
    c.onclick = () => openModal(rd, it, i);
    g.appendChild(c);
  }
  renderSlots();
}

function openModal(rd, it, slotIdx){
  const [rnum, ch, code, mn, img, base, prov] = it;
  const s = $('#sheet'); s.innerHTML = '';
  const no = document.createElement('div'); no.className='no'; no.textContent = selId(rd, rnum);
  s.appendChild(no);
  s.appendChild(box('gl', it));
  const eng = (!mn && ch) ? EN[ch] : '';
  const m = document.createElement('div');
  m.className = 'mn' + (mn ? '' : ' none');
  m.textContent = mn || '뜻 정보 없음';
  s.appendChild(m);

  // 훈이 없고 영문 자해만 있는 글자. 영문 그대로 보여준다.
  // 한국식 훈이 아니라는 것을 적어 둔다.
  if (eng){
    const e = document.createElement('div'); e.className='en';
    const h = document.createElement('div'); h.className='enh';
    h.textContent = 'Unihan 영문 뜻 · 한국식 훈이 아님';
    const t = document.createElement('div'); t.className='ent'; t.textContent = eng;
    e.appendChild(h); e.appendChild(t); s.appendChild(e);
  }

  const src = document.createElement('div'); src.className='src';
  const lines = [];
  // prov 가 있으면 다른 글자에서 빌려온 훈이다. 그 글자 고유의 훈으로
  // 오해하지 않도록 밝힌다. 특수자형은 아래 자형 안내가 같은 말을 하므로 뺀다.
  if (prov && ch) lines.push('위 뜻은 ' + prov + ' 인 글자의 뜻입니다.');
  if (mn) lines.push('뜻 출처: hanja.txt, Unihan Database');
  if (eng) lines.push('영문 뜻 출처: Unihan Database (C) Unicode, Inc.');
  lines.push(ch ? '2024. 6. 11. 시행 인명용 한자표 기준'
    : '이 자형은 일반 문자로 복사하면 모양이 유지되지 않을 수 있습니다.'
      + (base ? ' (' + base + ' 와 같은 글자의 다른 자형)' : ''));
  for (const t of lines){
    const d = document.createElement('div'); d.textContent = t; src.appendChild(d);
  }
  s.appendChild(src);
  const bs = document.createElement('div'); bs.className='btns';
  bs.style.justifyContent = 'center';
  const ok = document.createElement('button'); ok.className='b';
  ok.textContent = ch ? '이 한자 선택' : '이 자형 선택';
  ok.onclick = () => {
    slots[slotIdx].sel = it;
    closeModal();
    drawPick(slotIdx);          // 목록의 선택 표시만 갱신 (아래로 스크롤하지 않음)
    refresh();
    // 고른 결과와 다음 글자 칸이 위에 있다. 아래에 머물면 확인이 안 된다.
    window.scrollTo({top:0, behavior:'smooth'});
  };
  const no2 = document.createElement('button'); no2.className='b sub'; no2.textContent='닫기';
  no2.onclick = closeModal;
  bs.appendChild(ok); bs.appendChild(no2); s.appendChild(bs);
  $('#modal').classList.add('open');
}
function closeModal(){ $('#modal').classList.remove('open'); }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

function refresh(){
  const picked = slots.filter(s => s.sel);
  const r = $('#res');
  if (!picked.length){ r.style.display='none'; return; }
  r.style.display = 'block';
  const ids = [];
  let hasSpecial = false;
  for (const s of picked){
    const it = s.sel;
    ids.push(selId(s.rd, it[0]));
    if (!it[1]) hasSpecial = true;
  }
  const text = '인명용 한자 선택번호\n' + ids.join(' · ') + '\n자료 기준: 2024. 6. 11.';
  $('#cbox').textContent = text;
  $('#cbox').dataset.text = text;
  $('#wbox').style.display = hasSpecial ? 'block' : 'none';
  $('#wbox').textContent = '특수 자형이 포함되어 있어 문자로 복사하면 모양이 달라질 수 있습니다. '
    + '선택번호를 알려주세요.';
}

$('#bcopy').onclick = () => {
  const t = $('#cbox').dataset.text || '';
  navigator.clipboard.writeText(t).then(
    () => { const b=$('#bcopy'); const o=b.textContent; b.textContent='복사되었습니다';
            setTimeout(()=>b.textContent=o, 1600); },
    () => { const b=$('#bcopy'); b.textContent='복사 실패 - 아래 글자를 직접 선택해 주세요'; });
};
function drawShow(){
  const picked = slots.filter(s => s.sel);
  if (!picked.length) return;
  const row = $('#showrow'); row.innerHTML = '';
  const n = picked.length;
  const land = window.matchMedia('(orientation: landscape)').matches;
  row.className = 'showrow' + (land ? ' land' : '');
  // 세로 화면이면 높이를, 가로 화면이면 너비를 나눠 쓴다.
  const size = land
    ? 'min(' + Math.floor(84 / n) + 'vw, 56vh)'
    : 'min(76vw, ' + Math.floor(62 / n) + 'vh)';
  for (const s of picked){
    const it = s.sel;
    const c = document.createElement('div'); c.className = 'scell';
    const no = document.createElement('div'); no.className='no';
    no.textContent = selId(s.rd, it[0]); c.appendChild(no);
    const g = box('gl', it);
    if (it[4]) g.firstChild.style.width = g.firstChild.style.height = size;
    else g.style.fontSize = size;
    c.appendChild(g);
    const rm = document.createElement('div'); rm.className='rdmn';
    rm.innerHTML = '<b>' + s.rd + '</b>' + (it[3] ? ' · ' + it[3] : '');
    c.appendChild(rm);
    row.appendChild(c);
  }
}
$('#bshow').onclick = () => {
  if (!slots.some(s => s.sel)) return;
  drawShow();
  $('#show').classList.add('open');
  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{});
};
window.addEventListener('resize', () => {
  if ($('#show').classList.contains('open')) drawShow();
});
$('#bclose').onclick = () => $('#show').classList.remove('open');
$('#show').onclick = e => { if (e.target.id === 'show') $('#show').classList.remove('open'); };

$('#breset').onclick = () => {
  slots = [{rd:'', sel:null},{rd:'', sel:null},{rd:'', sel:null}]; active=-1;
  $('#pick').style.display='none'; $('#res').style.display='none';
  renderSlots(); window.scrollTo({top:0, behavior:'smooth'});
};

renderSlots();
</script>
</body>
</html>
