<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex"><title>인명용 한자 조회 (전체)</title>
<style>
  :root { --line:#d5d5d5; --dim:#666; --accent:#1a4f8a; --W:940px; --H:700px; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#e9ecef;
              font:14px/1.55 "맑은 고딕","Malgun Gothic",sans-serif; color:#222; }
  #app { width:var(--W); height:var(--H); margin:14px auto; background:#fff;
         border:1px solid #c3c8cd; border-radius:8px; overflow:hidden;
         display:flex; flex-direction:column; box-shadow:0 2px 10px rgba(0,0,0,.10); }

  /* 1줄 : 검색 */
  #bar { padding:10px 14px 8px; border-bottom:1px solid var(--line); flex:none; }
  #bar .t { font-size:15px; font-weight:bold; margin-bottom:7px; }
  #bar .t span { font-weight:normal; font-size:11px; color:var(--dim); margin-left:8px; }
  #bar .r { display:flex; gap:6px; align-items:center; }
  #q { font-size:16px; padding:5px 10px; width:170px; border:1px solid #bbb; border-radius:4px; }
  .cho { display:flex; flex-wrap:wrap; gap:2px; }
  .cho button { font-size:12px; padding:3px 6px; border:1px solid var(--line);
                background:#fff; border-radius:3px; cursor:pointer; }
  .cho button:hover, .cho button.on { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* 2줄 : 선택한 한자 확대 */
  #view { flex:none; height:196px; display:flex; align-items:center; gap:16px;
          padding:10px 16px; border-bottom:1px solid var(--line); background:#fbfbfc; }
  #vch { width:176px; height:176px; flex:none; display:flex; align-items:center;
         justify-content:center; border:1px solid var(--line); border-radius:6px;
         background:#fff; overflow:hidden; }
  #vch .g { font-family:"HANBatang","한컴바탕","Batang","바탕","Noto Serif KR",serif;
            font-size:148px; line-height:1; }
  #vch img { width:170px; height:170px; image-rendering:auto; }
  #vch .none { color:#aaa; font-size:13px; text-align:center; }
  /* #view 는 196px 고정이다. 안내문이 여럿 겹치는 글자(이체자 + 자형 경고 +
     자동번역 주석)에서는 내용이 더 길어질 수 있다. 잘라 내지 말고 스크롤한다. */
  #vinfo { flex:1; min-width:0; align-self:flex-start; padding-top:6px;
           max-height:100%; overflow-y:auto; }
  #vinfo .h { font-size:21px; font-weight:bold; }
  #vinfo .h em { font-style:normal; font-size:15px; color:#444; font-weight:normal; margin-left:8px; }
  #vinfo .sub { color:var(--dim); font-size:11px; margin:3px 0 8px; }
  #vinfo button { padding:5px 12px; font-size:13px; border:1px solid var(--accent);
                  background:var(--accent); color:#fff; border-radius:4px; cursor:pointer; }
  .note { background:#fff4e5; border:1px solid #e5c9a0; padding:5px 8px; border-radius:4px;
          font-size:11.5px; margin-top:6px; line-height:1.5; }

  /* Unihan 자동번역 참고정보. 훈 영역과 확실히 달라 보여야 한다.
     #vinfo 로 한정한다. 범위를 안 주면 목록 카드의 class="mn mt" 에도 걸려
     카드 안에 점선 상자와 여백이 생기고 글자 아래가 잘린다. */
  #vinfo .mt { background:#f2f4f7; border:1px dashed #b6bec8; padding:5px 8px 6px;
        border-radius:4px; margin-top:6px; line-height:1.45; }
  #vinfo .mt .mth { font-size:11px; color:#5c6672; font-weight:bold; margin-bottom:3px; }
  #vinfo .mt .mth .warn { background:#c94f2e; color:#fff; font-weight:normal; border-radius:3px;
                   padding:0 5px; margin-left:5px; }
  #vinfo .mt .mth .ok   { background:#0f7b4f; color:#fff; font-weight:normal; border-radius:3px;
                   padding:0 5px; margin-left:5px; }
  #vinfo .mt .mth .not  { color:#c94f2e; font-weight:normal; margin-left:6px; }
  #vinfo .mt .mten { font-size:12px; color:#3c4650; font-style:italic; }
  #vinfo .mt .mtko { font-size:13px; color:#1a1a1a; margin-top:2px; }
  #vinfo .mt .mtn  { font-size:10.5px; color:#7b848d; margin-top:3px; }
  #mtopt { font-size:11px; color:var(--dim); margin-left:8px; white-space:nowrap;
           cursor:pointer; user-select:none; }
  #mtopt input { vertical-align:-1px; margin-right:2px; }

  /* 3줄 : 목록 */
  #stat { flex:none; padding:6px 16px; font-size:12px; color:var(--dim);
          border-bottom:1px solid #eee; background:#fafafa; }
  #grid { flex:1; overflow-y:auto; padding:10px 14px 14px;
          display:grid; grid-template-columns:repeat(7,1fr); gap:7px; align-content:start; }
  .card { border:1px solid var(--line); border-radius:5px; padding:17px 4px 5px;
          text-align:center; cursor:pointer; position:relative; height:112px;
          display:flex; flex-direction:column; background:#fff;
          /* 높이가 고정이라 안쪽이 길어지면 칸 밖으로 흘러나온다. 잘라 낸다. */
          overflow:hidden; }
  .card:hover { border-color:var(--accent); background:#f4f8fd; }
  .card.sel { border-color:var(--accent); border-width:2px; background:#eaf2fb; padding-top:16px; }
  .card .g { font-family:"HANBatang","한컴바탕","Batang","바탕","Noto Serif KR",serif;
             font-size:38px; line-height:1.1; height:44px; }
  .card img { width:42px; height:42px; margin:1px auto 0; display:block; }
  .card .rd { font-size:11.5px; color:#333; }
  .selno { position:absolute; top:2px; left:3px; font-size:9.5px; color:#fff;
           background:var(--accent); border-radius:2px; padding:0 3px; letter-spacing:.02em; }
  .card.hasnum { padding-top:19px; }
  .tag.shift { left:auto; right:20px; }
  #vinfo .selbig { display:inline-block; background:var(--accent); color:#fff;
                   border-radius:3px; padding:1px 7px; font-size:13px; margin-right:6px; }
  .card .mn { font-size:10.5px; color:var(--dim); line-height:1.3; word-break:keep-all;
              display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
              overflow:hidden;
              /* flex 자식은 min-height:auto 라 줄여지지 않는다. 이게 없으면
                 line-clamp 가 걸려도 칸 높이를 밀어낸다. */
              min-height:0; flex:0 1 auto; }
  /* 자동번역은 훈과 한눈에 달라 보여야 한다. 목록을 훑을 때 둘을 같은
     것으로 읽으면 안 된다. 기울임 + 점선 밑줄 + 접두 표지.
     밑줄은 클램프 박스가 아니라 안쪽 글자에만 건다. 박스에 border 를 걸면
     -webkit-line-clamp 가 어긋난다. */
  .card .mn.mt { color:#6b7684; font-style:italic; }
  .card .mn.mt i { text-decoration:underline dotted #b6bec8; font-style:italic; }
  .card .mn.mt b { font-style:normal; font-weight:normal; color:#fff;
                   background:#96a0ab; border-radius:2px; padding:0 3px;
                   margin-right:3px; font-size:9px; }
  .card .mn.none { color:#c2c8ce; }
  .tag { position:absolute; top:2px; left:3px; font-size:9px; color:#fff;
         background:#8a8a8a; border-radius:2px; padding:0 3px; }
  .tag.기초{background:#3a7d44} .tag.별표1{background:#2d5f9a} .tag.별표2{background:#96631e}
  /* 카드 오른쪽 위의 🖼 / ⚠ / 🔒 표지. 범위를 안 주면 상세 패널의
     '미검수' 배지까지 절대위치로 끌려가 엉뚱한 자리에 붙는다. */
  .card .warn { position:absolute; top:2px; right:4px; font-size:10px; }
  .card.sp .base { font-size:10.5px; color:#8a5a1e; }
  .card.sp { background:#fff8f0; border-color:#e0b98a; }
  .card.sp .g { font-size:11px; color:#8a5a1e; font-family:inherit; padding-top:11px; }
  #foot { flex:none; padding:4px 16px 6px; font-size:10px; color:#999; border-top:1px solid #eee; }
  #foot .mtfoot { margin-top:2px; color:#8a939c; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="t">인명용 한자 조회 <span id="meta"></span><a href="simple.html" style="float:right;font-size:11px;font-weight:normal;color:#1a4f8a">간편 조회 →</a></div>
    <div class="r">
      <input type="text" id="q" placeholder="독음 또는 뜻" autocomplete="off">
      <label id="mtopt" title="한국식 훈 검색에는 자동번역이 들어가지 않습니다. 이 옵션을 켤 때만 함께 찾습니다.">
        <input type="checkbox" id="qmt"> 영문 뜻·자동번역에서도 검색
      </label>
      <div class="cho" id="cho"></div>
    </div>
  </div>
  <div id="view">
    <div id="vch"><div class="none">한자를 선택하세요</div></div>
    <div id="vinfo"></div>
  </div>
  <div id="stat">독음 또는 뜻을 입력하세요. (예: 가 / 아름다울)</div>
  <div id="grid"></div>
  <div id="foot"></div>
</div>

// Unihan 원문에 & 나 < 가 들어 있다. innerHTML 로 넣기 전에 막는다.
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// 카드 한 칸은 2줄, 16자 남짓이다. 번역은 최대 77자까지 있다(㽘).
// 첫 갈래만 남기고 그래도 길면 자른다. 전체는 툴팁과 상세 패널에 있다.
const MTCARD = 16;
function shortMT(s){
  const full = s.trim();
  let t = full.split(';')[0].trim();
  const more = t.length < full.length;
  const cap = more ? MTCARD - 2 : MTCARD;   // ' …' 두 자리를 미리 뺀다
  if (t.length > cap) return t.slice(0, cap - 1).trim() + '…';
  return more ? t + ' …' : t;
}
const $ = s => document.querySelector(s);

// 폰트에 글자가 없으면 두부(.notdef)로 그려진다.
// CJK 폰트는 모든 한자가 같은 전각 폭이라 measureText 로는 구분되지 않는다.
// 실제로 그려 본 픽셀을 비교해야 한다.
const TCV = document.createElement('canvas'); TCV.width = TCV.height = 40;
const TC = TCV.getContext('2d', {willReadFrequently:true});
TC.font = '30px "HANBatang","한컴바탕","Batang","바탕","Noto Serif KR",serif';
TC.textBaseline = 'top';
function sig(ch){
  TC.clearRect(0,0,40,40);
  try { TC.fillText(ch,3,3); } catch(e) { return 'ERR'; }
  const d = TC.getImageData(0,0,40,40).data;
  let ink=0, h=0;
  for (let i=3;i<d.length;i+=4) if (d[i]>16) { ink++; h=(h*33+i)>>>0; }
  return ink+':'+h;
}
const TOFU = new Set(['\u{A0111}','\u{A0222}','\u{A0333}'].map(sig));
const BLANK = sig(' ');
const tcache = {};
function isTofu(ch){
  if (!(ch in tcache)) { const s = sig(ch); tcache[ch] = TOFU.has(s) || s === BLANK; }
  return tcache[ch];
}

// 글꼴로 못 그리는 글자는 원본 별표 PDF 의 자형 이미지로 대신 보여준다.
function glyphNode(ch, cls){
  if (ch && isTofu(ch) && G[ch]) { const i=new Image(); i.src=G[ch]; i.alt=ch; return i; }
  const e = document.createElement('div');
  e.className = cls;
  e.textContent = ch || '';
  return e;
}

let cur = null;
function select(id){
  const r = D.rows[id];
  const [ch,rd,mn,ap,vo,cc,kr,ver] = r;
  document.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel'));
  const card = document.querySelector('[data-id="'+id+'"]');
  if (card) card.classList.add('sel');

  const base = r[8] || '', guess = r[9] || '';
  const box = $('#vch'); box.innerHTML = '';
  if (ch) box.appendChild(glyphNode(ch,'g'));
  else if (CG[cc]) { const i=new Image(); i.src=CG[cc]; i.alt='시스템 전용 자형'; box.appendChild(i); }
  else { const e=document.createElement('div'); e.className='none';
         e.innerHTML='시스템 전용 자형<br><small>'+cc+'</small>'; box.appendChild(e); }

  let notes = '';
  const N = t => '<div class="note">'+t+'</div>';
  if (!ch){
    if (base) notes += N('<b>'+base+'</b> 와 같은 글자의 다른 자형입니다. 규칙 주3 에 따라 '
        + '<b>示</b>변↔<b>礻</b>변, <b>艹</b>변↔<b>⺿</b>변은 서로 바꿔 쓸 수 있으므로, '
        + '아래 <b>'+base+' 복사</b> 로 그대로 쓰시면 됩니다.');
    else if (guess) notes += N('<b>'+guess+'</b> 의 다른 자형으로 추정되나 확정하지 못했습니다. '
        + '문자로 복사할 수 없으니 전자가족관계등록시스템에서 확인해 주세요.');
    else notes += N('유니코드에 없는 자형입니다(대법원 코드 <code>'+cc+'</code>). '
        + '문자로 복사할 수 없으니 전자가족관계등록시스템에서 직접 선택해 주세요.');
  }
  else if (isTofu(ch)) notes += N(G[ch]
        ? '이 PC 글꼴에 없는 글자라 <b>별표 원본 이미지</b>로 표시했습니다. 복사는 정상입니다.'
        : '이 PC 글꼴이 이 글자를 지원하지 않습니다. 복사는 정상이지만 화면에 안 보입니다.');
  // 다른 글자에서 빌려온 훈이면 밝힌다. 이 글자 고유의 훈으로 읽히면 안 된다.
  if (r[11] && ch) notes += N('위 뜻은 <b>'+r[11]+'</b> 인 글자의 뜻입니다. 이 글자의 훈이 자료에 따로 없습니다.');

  // Unihan 영문 자해의 자동번역. 훈이 없는 글자에만 붙는다.
  // 영문 원문과 번역을 항상 함께 띄운다. 번역만 보면 검증된 훈으로 오해한다.
  // 이 행에 훈이 있으면 띄우지 않는다. 훈이 우선이고 번역은 훈이 없을 때만이다.
  const mt = (ch && !mn) ? MT[ch] : null;
  if (mt){
    const reviewed = mt[2] === 'human-reviewed';
    notes += '<div class="mt">'
      + '<div class="mth">Unihan 영문 뜻 자동번역(미검수)'
      + (reviewed ? '<span class="ok">검토 완료</span>'
                  : '<span class="warn">미검수</span>')
      + '<span class="not">한국식 훈이 아님</span></div>'
      + '<div class="mten">' + esc(mt[0]) + '</div>'
      + (mt[1] ? '<div class="mtko">' + esc(mt[1]) + '</div>' : '')
      // 저작권·미검수 고지는 글자마다 같은 문장이라 화면 아래 고지줄에 한 번만
      // 둔다. 여기서 반복하면 상세 칸(196px)을 넘겨 아랫줄이 잘린다.
      // 글자마다 다른 것은 원문 오류 주석(mt[3]) 뿐이라 그것만 남긴다.
      + (mt[3] ? '<div class="mtn">※ ' + esc(mt[3]) + '</div>' : '')
      + '</div>';
  }
  if (kr) notes += N('본자와 허용자체의 <b>유니코드 코드포인트가 같습니다.</b> 문자만으로는 두 자형을 구분할 수 없습니다.');
  if (vo) notes += N('별표2 허용자체입니다. 본자는 <b>'+vo+'</b> 입니다.');
  if (ver==='probable'||ver==='api-listed')
    notes += N('자동 판정 결과로 교차 검증이 완료되지 않았습니다. 등록 전 대법원 조회로 확인해 주세요.');

  $('#vinfo').innerHTML =
      '<div class="h">'
    + (r[10] ? '<span class="selbig">'+rd+'-'+String(r[10]).padStart(2,'0')+'</span>' : '')
    + rd+(mn?'<em>'+mn+'</em>':'<em style="color:#aaa">뜻 정보 없음</em>')+'</div>'
    + '<div class="sub">'+(ch?'U+'+ch.codePointAt(0).toString(16).toUpperCase()
                             :'대법원 코드 '+cc+(base?' · '+base+'('+'U+'+base.codePointAt(0).toString(16).toUpperCase()+') 의 다른 자형':''))
    + (ap?' · '+ap:'') + ' · ' + ver + '</div>'
    + (ch ? '<button id="bcopy">한자 복사</button>'
          : (base ? '<button id="bcopy">'+base+' 복사</button>' : ''))
    + ' <span id="cmsg" style="font-size:11px;color:#2d7a3e"></span>' 
    + notes;
  const cptarget = ch || base;
  if (cptarget && $('#bcopy')) $('#bcopy').onclick = () => copy(cptarget);
  cur = id;
}

function copy(ch){
  navigator.clipboard.writeText(ch).then(
    ()=>{ const m=$('#cmsg'); if(m){ m.textContent='복사됨'; setTimeout(()=>m.textContent='',1500); } },
    ()=>{ const m=$('#cmsg'); if(m) m.textContent='복사 실패'; });
}

function render(ids, label){
  const g = $('#grid'); g.innerHTML = '';
  $('#stat').textContent = label + ' — ' + ids.length.toLocaleString() + '자';
  const frag = document.createDocumentFragment();
  for (const id of ids){
    const [ch,rd,mn,ap,vo] = D.rows[id];
    const c = document.createElement('div');
    c.className = 'card' + (ch ? '' : ' sp');
    c.dataset.id = id;
    const rn = D.rows[id][10];
    if (rn){ const n=document.createElement('span'); n.className='selno';
             n.textContent = rd+'-'+String(rn).padStart(2,'0');
             n.title='선택번호'; c.appendChild(n); c.classList.add('hasnum'); }
    if (ap){ const t=document.createElement('span');
             t.className='tag '+ap+(rn?' shift':''); t.textContent=ap; c.appendChild(t); }
    if (ch && isTofu(ch)){ const w=document.createElement('span'); w.className='warn';
      w.textContent = G[ch] ? '🖼' : '⚠';
      w.title = G[ch] ? '별표 원본 이미지로 표시' : '이 PC 글꼴이 지원하지 않음'; c.appendChild(w); }
    if (!ch){ const w=document.createElement('span'); w.className='warn'; w.textContent='🔒';
      w.title='유니코드로 표현할 수 없는 자형'; c.appendChild(w); }
    if (ch) c.appendChild(glyphNode(ch,'g'));
    else if (CG[D.rows[id][5]]) { const i=new Image(); i.src=CG[D.rows[id][5]];
      i.alt='대법원 시스템 자형'; c.appendChild(i); }
    else { const e=document.createElement('div'); e.className='g'; e.textContent='시스템 자형'; c.appendChild(e); }
    const r1=document.createElement('div'); r1.className='rd';
    r1.textContent = rd + (vo ? ' →'+vo : ''); c.appendChild(r1);
    const r2=document.createElement('div');
    const bs = D.rows[id][8], gs = D.rows[id][9];
    if (!D.rows[id][0] && (bs||gs)) { r2.className='mn base';
      r2.textContent = bs ? bs+' 의 다른 자형' : (gs+' 추정'); }
    else if (mn) { r2.className='mn'; r2.textContent = mn; }
    else {
      // 훈이 없다. 자동번역이 있으면 그것임을 밝혀 띄우고, 그마저 없으면
      // 빈 줄로 두지 않고 없다고 적는다. 빈 줄은 덜 그려진 것처럼 보인다.
      const e = MT[ch];
      if (e && e[1]){
        r2.className='mn mt';
        r2.innerHTML = '<b>자동</b><i>' + esc(shortMT(e[1])) + '</i>';
        r2.title = '자동번역(미검수) · 한국식 훈이 아님\n' + e[1] + '\n원문: ' + e[0];
      } else {
        r2.className='mn none'; r2.textContent='뜻 정보 없음';
      }
    }
    c.appendChild(r2);

    c.onclick = () => select(id);
    frag.appendChild(c);
  }
  g.appendChild(frag);
  g.scrollTop = 0;
}

(function init(){
  $('#meta').textContent = D.meta['기준'];
  $('#foot').innerHTML = D.meta['고지'].join(' · ')
    + '<div class="mtfoot">' + D.meta['고지_자동번역'] + '</div>';
  const cho = $('#cho');
  Object.keys(D.cho).forEach(c=>{
    const b = document.createElement('button'); b.textContent = c;
    b.onclick = () => {
      $('#q').value = '';
      document.querySelectorAll('.cho button.on').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      render(D.cho[c], '초성 '+c);
    };
    cho.appendChild(b);
  });
  // 옵션을 켜고 끄면 이미 입력해 둔 말로 다시 찾는다.
  $('#qmt').addEventListener('change', () => {
    $('#q').dispatchEvent(new Event('input'));
  });
  $('#q').addEventListener('input', e=>{
    const v = ($('#q').value || '').trim().replace(/\s+/g,'');
    document.querySelectorAll('.cho button.on').forEach(x=>x.classList.remove('on'));
    if (!v){ $('#stat').textContent='독음 또는 뜻을 입력하세요. (예: 가 / 아름다울)';
             $('#grid').innerHTML=''; return; }

    // 독음이 먼저다. 한 글자 한글이고 그 독음이 있으면 독음 검색.
    if (D.search[v]){ render(D.search[v], '독음 '+v); return; }

    // 그 밖에는 뜻으로 찾는다. 자형을 확인할 때 독음보다
    // 뜻이 기억나는 경우가 많다.
    //
    // 한국식 훈 검색에는 자동번역을 넣지 않는다. 넣으면 검증된 훈으로
    // 찾은 것과 기계가 옮긴 문장으로 찾은 것이 한 결과에 섞인다.
    // 옵션을 켠 경우에만 영문 원문과 번역을 함께 본다.
    const useMT = $('#qmt').checked;
    const lv = v.toLowerCase();
    const hit = [], mtHit = [];
    for (let i=0;i<D.rows.length;i++){
      const m = D.rows[i][2];
      if (m && m.indexOf(v) >= 0){ hit.push(i); continue; }
      if (!useMT || m) continue;   // 훈이 있는 행은 번역으로 찾지 않는다
      const e = D.rows[i][0] ? MT[D.rows[i][0]] : null;
      if (e && ((e[0] && e[0].toLowerCase().indexOf(lv) >= 0)
             || (e[1] && e[1].indexOf(v) >= 0))) mtHit.push(i);
    }
    if (!hit.length && !mtHit.length){
      $('#stat').textContent = '"'+v+'" 에 해당하는 독음도 뜻도 없습니다.'
        + (useMT ? '' : ' (영문 뜻·자동번역은 옵션을 켜야 검색됩니다)');
      $('#grid').innerHTML=''; return;
    }
    hit.sort((a,b)=>{
      const A=D.rows[a][2], B=D.rows[b][2];
      return (A.indexOf(v)-B.indexOf(v)) || A.length-B.length || A.localeCompare(B);
    });
    // 훈으로 찾은 것을 앞에 둔다. 자동번역으로 걸린 것은 뒤로 미룬다.
    const all = hit.concat(mtHit);
    let label = '뜻 "'+v+'"';
    if (mtHit.length) label += ' — 훈 '+hit.length+'건, 자동번역 '+mtHit.length+'건(미검수)';
    render(all.slice(0,600), label+(all.length>600?' (상위 600건만)':''));
  });
})();
</script>
</body>
</html>
